plugins {
    id 'com.android.library'

}

android {
    compileSdk rootProject.ext.compileSdkVersion
    namespace 'com.tencent.qcloud.tuikit.timcommon'
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        flavorDimensions "default"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
       /* debug {
            minifyEnabled false
        }*/
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 主题资源文件夹
    sourceSets {
        main {
            res.srcDirs += "src/main/res-light"
            res.srcDirs += "src/main/res-lively"
            res.srcDirs += "src/main/res-serious"
        }
    }
    productFlavors {
        kdxxj {}
        saodubi {}
    }
}

dependencies {
    /*plugin-build-Begin

    compileOnly fileTree(include: ['*.jar','*.aar'], dir: '../../../../tuikit/android/libs')

    plugin-build-End*/
    def projects = this.rootProject.getAllprojects().stream().map { project -> project.name }.collect()
    api projects.contains("tuicore") ? project(':tuicore') : "com.tencent.liteav.tuikit:tuicore:7.6.5011"

    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompat_version"
    implementation "com.google.code.gson:gson:$rootProject.ext.gson_version"
    implementation "com.github.bumptech.glide:glide:$rootProject.ext.glide_version"
    implementation "androidx.recyclerview:recyclerview:$rootProject.ext.recyclerview_version"
    implementation "androidx.viewpager2:viewpager2:$rootProject.ext.viewpager2_version"

//    implementation 'com.google.code.gson:gson:2.9.1'
//    implementation 'androidx.appcompat:appcompat:1.3.1'
//    implementation 'com.github.bumptech.glide:glide:4.12.0'
//    implementation 'androidx.recyclerview:recyclerview:1.2.1'
//    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}

